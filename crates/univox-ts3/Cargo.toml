[package]
name = "univox-ts3"
description = "TeamSpeak 3 driver for Univox: native client protocol + ServerQuery management"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["voice"]
# Opus encode/decode pipelines. Disable to avoid the static libopus
# dependency (e.g. when the embedder links its own opus, or on Android);
# start_sending/start_receiving then return `Error::Unsupported`.
voice = ["dep:univox-voice"]

[dependencies]
univox-core.workspace = true
univox-ts3-proto.workspace = true
univox-voice = { workspace = true, optional = true }
sha1.workspace = true
md-5.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
bytes.workspace = true
base64.workspace = true
rand.workspace = true
num-bigint-dig.workspace = true
quicklz = "0.3"
curve25519-dalek.workspace = true
async-trait.workspace = true

[dev-dependencies]
test-support.workspace = true
tracing-subscriber = { workspace = true }
