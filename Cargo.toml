[workspace]
resolver = "2"
members = [
    "crates/univox-core",
    "crates/univox-ts3-proto",
    "crates/univox-ts3",
    "crates/univox-voice",
    "crates/univox",
    "crates/test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/senlinjun/univox"

[workspace.dependencies]
# async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "signal", "process", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# util
bytes = "1"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
base64 = "0.22"
bitflags = "2"
serde_json = "1"

# voice
audiopus = "0.3.0-rc.0"

# crypto (TS3)
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "arithmetic"] }
curve25519-dalek = "4"
eax = "0.5"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
num-bigint-dig = "0.8"

# univox crates (version for crates.io publish; path wins locally)
univox-core = { version = "0.1.0", path = "crates/univox-core" }
univox-ts3-proto = { version = "0.1.0", path = "crates/univox-ts3-proto" }
# default-features = false：让继承方（门面 univox）的 voice feature 统一门控
# audiopus——关闭 voice 时静态 libopus 不进入依赖树。成员侧的
# default-features = false 对 workspace 继承会被忽略，必须写在这里。
univox-ts3 = { version = "0.1.0", path = "crates/univox-ts3", default-features = false }
univox-voice = { version = "0.1.0", path = "crates/univox-voice" }

# test
test-support = { path = "crates/test-support" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
